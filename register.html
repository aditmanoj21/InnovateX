<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — InnovateX Trade-In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">Innovate<span>X</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="device.html">Sell a Device</a></li>
        <li><a href="history.html">My Trade-Ins</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h1>Create your account</h1>
      <p class="subtitle">Register to submit devices and track your trade-in offers.</p>

      <form action="#" method="POST">
        <div class="field">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Rahul Sharma" required />
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="rahul@example.com" required />
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="98765 43210" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" minlength="6" required />
        </div>

        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter password" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <p class="form-footer-note">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <footer>
    <div class="container">
      &copy; 2026 InnovateX Trade-In Platform — CA Project
    </div>
  </footer>

</body>
</html>
