<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — InnovateX Trade-In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">Innovate<span>X</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="device.html">Sell a Device</a></li>
        <li><a href="history.html">My Trade-Ins</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="card form-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your devices and offers.</p>

      <form action="#" method="POST">
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="rahul@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="form-footer-note">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <footer>
    <div class="container">
      &copy; 2026 InnovateX Trade-In Platform — CA Project
    </div>
  </footer>

</body>
</html>
