<>

      <a href="index.html" class="brand">Innovate<span>X</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>

  <div class="container page-section">
    <h1>Trade-In History</h1>
    <p class="subtitle" style="margin-bottom: 24px;">All devices you've submitted, with their final status.</p>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Device</th>
          <th>Condition</th>
          <th>Offer</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        
      </tbody>
    </table>
  </div>

  <footer>
    <div class="container">
      &copy; 2026 InnovateX Trade-In Platform — CA Project
    </div>
  </footer>

<script>

    const history =
        JSON.parse(
            localStorage.getItem("tradeInHistory")
        ) || [];

    const historyBody =
        document.getElementById("historyBody");

    history
        .slice()
        .reverse()
        .forEach(function(record) {

            const row = document.createElement("tr");

            const dateCell = document.createElement("td");
            dateCell.textContent = record.date || "-";

            const deviceCell = document.createElement("td");
            deviceCell.textContent =
                `${record.brand || "-"} ${record.model || "-"}, ${record.storage || "-"}`;

            const conditionCell = document.createElement("td");
            conditionCell.textContent =
                record.condition || "Assessed";

            const offerCell = document.createElement("td");
            offerCell.textContent =
                "₹" +
                Number(record.finalValue || 0)
                    .toLocaleString("en-IN");

            const statusCell = document.createElement("td");

            const statusBadge = document.createElement("span");

            statusBadge.textContent =
                record.status || "Pending";

            if (record.status === "Accepted") {

                statusBadge.className =
                    "badge badge-accepted";

            } else if (record.status === "Rejected") {

                statusBadge.className =
                    "badge badge-rejected";

            } else {

                statusBadge.className =
                    "badge badge-pending";
            }

            statusCell.appendChild(statusBadge);

            row.appendChild(dateCell);
            row.appendChild(deviceCell);
            row.appendChild(conditionCell);
            row.appendChild(offerCell);
            row.appendChild(statusCell);

             row.innerHTML = `
            <td>${record.date || "-"}</td>
            <td>${record.brand || "-"} ${record.model || "-"}, ${record.storage || "-"}</td>
            <td>${record.condition || "Assessed"}</td>
            <td>₹${Number(record.finalValue || 0).toLocaleString("en-IN")}</td>
            <td>
                <span class="badge ${
                    record.status === "Accepted"
                        ? "badge-accepted"
                        : "badge-rejected"
                }">
                    ${record.status || "Pending"}
                </span>
            </td>
        `;

            historyBody.insertBefore(
                row,
                historyBody.firstChild
            );

        });

</script>

</body>
</html>
